syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.DreamGamingService.Protos";

package GameInterfaceDreamGamingService;

// The greeting service definition.
service  GameInterfaceDreamGamingService{
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);  
  rpc PlayerOnline (PlayerOnlineRequest) returns (PlayerOnlineReply);
  rpc PlayerKick (PlayerKickRequest) returns (BaseReply);
  rpc PlayerTableLimit (PlayerTableLimitRequest) returns (BaseReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (FundStatusReply);  
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameHistorySettled (GameHistorySettledRequest) returns (GameHistorySettledReply);
  rpc GameHistoryMark (GameHistoryMarkRequest) returns (BaseReply);
  rpc GameHistoryDetail (GameHistoryDetailRequest) returns (GameHistoryDetailReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1;
	string api_key = 2;
	string agent_name = 3;
	string username = 4;
	string password = 5;
	string currency_name = 6;
	string table_limit = 7;
	int32 win_limit = 8;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string api_key = 2;
	string agent_name = 3;
	string username = 4;
}

message PlayerOnlineRequest {
	string api_url = 1;
	string api_key = 2;
	string agent_name = 3;
}

message PlayerKickRequest {
	string api_url = 1;
	string api_key = 2;
	string agent_name = 3;
	int64 member_id = 4;
}

message PlayerTableLimitRequest {
	string api_url = 1;
	string api_key = 2;
	string agent_name = 3;
	string username = 4;
	string table_limit = 5;
}

message FundRequest {
	string api_url = 1;
	string api_key = 2;
	string agent_name = 3;
	string username = 4;
	string ref_transaction_code = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;
	string api_key = 2;
	string agent_name = 3;
	string ref_transaction_code = 4;
}

message GameUrlRequest {
	string api_url = 1;
	string api_key = 2;
	string agent_name = 3;
	string username = 4;
	string password = 5;
	bool is_mobile = 6;
	string lang = 7;
}

message GameHistorySettledRequest {
	string api_url = 1;	
	string api_key = 2;
	string agent_name = 3;	
}

message GameHistoryMarkRequest {
	string api_url = 1;	
	string api_key = 2;
	string agent_name = 3;	
	repeated string external_round_ids = 4;
}

message GameHistoryDetailRequest {
	string video_game_api_url = 1;
	string agent_name = 2;
	string language = 3;
	string id = 4;
}

// The response message containing the greetings.
message BaseReply{
	bool status = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message PlayerOnlineReply {
	repeated PlayerOnline items = 1;
}

message PlayerOnline {
	string player_code = 1;
	int64 member_id = 2;
}

message FundReply {
	string ref_transaction_code = 1;
    string transaction_id = 2;
    phoenix.protobuf.DecimalValue balance = 3; 
}

message FundStatusReply {
	bool is_order_exist = 1;
}

message GameUrlReply {	
	string game_url = 1;
}

message GameHistorySettledReply {
	repeated GameHistorySettled items = 1;
}

message GameHistorySettled {
	string player_code = 1;
    string external_round_id = 2;
	bool is_closed = 3;    
    bool is_void = 4;    
	google.protobuf.Timestamp external_created_on = 5;
	google.protobuf.Timestamp external_closed_on = 6;
	phoenix.protobuf.DecimalValue bet = 7;
	phoenix.protobuf.DecimalValue valid_bet = 8;
	phoenix.protobuf.DecimalValue player_win_loss = 9;
	phoenix.protobuf.DecimalValue turnover = 10;
	phoenix.protobuf.DecimalValue settle = 11;
    string additional_data = 12;
	string external_game_id = 13;
}

message GameHistoryDetailReply {
	string game_result = 1;
}